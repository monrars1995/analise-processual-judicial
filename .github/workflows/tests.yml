name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdfplumber reportlab

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test script imports
      run: |
        python -c "import scripts.extrair_dados"
        python -c "import scripts.identificar_irregularidades"
        python -c "import scripts.gerar_relatorio"
        python -c "import scripts.estatisticas"

    - name: Test with sample data
      run: |
        mkdir -p /tmp/test_output
        # Create minimal test JSON
        python3 -c "
import json, datetime
sample = {
  'fonte': 'test.pdf',
  'total_paginas': 10,
  'metadados': {
    'numero_processo': '0000000-00.0000.0.00.0000',
    'classe': 'Procedimento do Juizado Especial Cível',
    'assunto': 'Crédito Direto ao Consumidor - CDC',
    'prioridade': 'IDOSO(A) - 60 A 79 ANOS',
    'data_distribuicao': '01/01/2024',
    'valor_causa': 'R$ 10.000,00',
    'segredo_justica': 'Não',
    'partes': [{'polo': 'ativo', 'nome': 'AUTOR TESTE'}, {'polo': 'passivo', 'nome': 'REU TESTE'}]
  },
  'indice_documentos': [
    {'id': '1', 'data': '01/01/2024', 'hora': '10:00', 'documento': 'PETICAO INICIAL.pdf', 'tipo': 'Petição Inicial'},
    {'id': '2', 'data': '05/01/2024', 'hora': '10:00', 'documento': 'CITACAO', 'tipo': 'Citação'},
    {'id': '3', 'data': '25/01/2024', 'hora': '10:00', 'documento': 'CONTESTACAO', 'tipo': 'Contestação'},
  ],
  'andamentos_detectados': [],
  'linha_do_tempo': [
    {'id': '1', 'data': '01/01/2024', 'hora': '10:00', 'documento': 'PETICAO INICIAL.pdf', 'tipo': 'Petição Inicial', 'origem': 'indice'},
    {'id': '2', 'data': '05/01/2024', 'hora': '10:00', 'documento': 'CITACAO', 'tipo': 'Citação', 'origem': 'indice'},
    {'id': '3', 'data': '25/01/2024', 'hora': '10:00', 'documento': 'CONTESTACAO', 'tipo': 'Contestação', 'origem': 'indice'},
  ]
}
with open('/tmp/test_output/test_dados.json', 'w') as f:
    json.dump(sample, f)
"
        python scripts/identificar_irregularidades.py /tmp/test_output/test_dados.json /tmp/test_output/test_irregs.json
        python scripts/gerar_relatorio.py /tmp/test_output/test_dados.json /tmp/test_output/test_irregs.json /tmp/test_output/test_relatorio.pdf
        python scripts/estatisticas.py /tmp/test_output/test_dados.json /tmp/test_output/test_stats.json
        ls -lh /tmp/test_output/
